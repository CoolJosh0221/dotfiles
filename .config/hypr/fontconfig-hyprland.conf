<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep Arch/user fallbacks, then apply the Hyprland UI choice and rendering. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <!-- Fontconfig resolves relative includes from its cache/config roots, not from
       FONTCONFIG_FILE. Keep this explicit so the session-only UI alias loads. -->
  <include ignore_missing="no">/home/hosh/.config/hypr/fontconfig-ui-font.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <!-- Slight grayscale hinting preserves smooth curves and natural spacing
         without the colored fringes produced by LCD subpixel rendering. -->
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
