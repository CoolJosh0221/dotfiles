$font = Hyprland UI

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = tn, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, tn
    animation = fadeOut, 1, 4, tn
    animation = inputFieldDots, 1, 3, tn
}

background {
    monitor =
    path = /home/hosh/.config/hypr/wallpapers/current.png
    color = rgb(222436)
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    brightness = 0.64
}

label {
    monitor =
    text = $TIME
    color = rgb(c8d3f5)
    font_size = 82
    font_family = $font
    position = 0, 145
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(86e1fc)
    font_size = 17
    font_family = $font
    position = 0, 82
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgb(c099ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 58
    outline_thickness = 2
    inner_color = rgba(1e2030e6)
    outer_color = rgba(82aaffee) rgba(c099ffee) 45deg
    check_color = rgba(86e1fcee) rgba(c3e88dee) 45deg
    fail_color = rgba(ff757fee)
    font_color = rgb(c8d3f5)
    font_family = $font
    placeholder_text = <span foreground="##7a88cf">Password</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    rounding = 16
    fade_on_empty = false
    dots_spacing = 0.25
    position = 0, -82
    halign = center
    valign = center
}
