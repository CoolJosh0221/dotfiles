[dmenu]
# Inherit the shared Fuzzel theme and place this menu just below Waybar.
# Allow empty input so the password prompt remains open before typing.
dmenu_command = fuzzel --anchor=top-right --x-margin=12 --y-margin=10 --width=52 --lines=12 --minimal-lines --no-icons --no-sort --override=dmenu.exit-immediately-if-empty=no
active_chars = ●
highlight = False
compact = True
format = {name}  {signal}%%  {sec}
list_saved = False
prompt = Search Wi-Fi / Rescan

[dmenu_passphrase]
obscure = True

[editor]
terminal = wezterm start --
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
