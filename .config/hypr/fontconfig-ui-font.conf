<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Managed by scripts/set-ui-font. The first family is the current choice. -->
  <alias binding="strong">
    <family>Hyprland UI</family>
    <prefer><family>Hanken Grotesk</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Hanken Grotesk</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Hanken Grotesk</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Hanken Grotesk</family></prefer>
  </alias>
</fontconfig>
