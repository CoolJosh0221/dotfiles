[main]
namespace=launcher
font=Hyprland UI:size=13:weight=medium,JetBrainsMono Nerd Font:size=13
use-bold=yes
dpi-aware=no
terminal=wezterm start --
prompt=  󰍉
placeholder=Search applications…
icons-enabled=yes
fields=filename,name,generic,keywords
match-mode=fzf
filter-desktop=yes
width=80
lines=12
horizontal-pad=34
vertical-pad=26
inner-pad=16
image-size-ratio=0.50
layer=overlay
anchor=center
exit-on-keyboard-focus-loss=yes

[colors]
background=181923f2
text=c8d3f5ff
prompt=82aaffff
placeholder=7a88cfff
input=c8d3f5ff
match=86e1fcff
selection=2f334ddd
selection-text=c8d3f5ff
selection-match=c099ffff
counter=7a88cfff
border=c099ffb8

[border]
width=1
radius=18

[dmenu]
exit-immediately-if-empty=yes
