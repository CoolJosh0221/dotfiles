# ~/.tmux.conf -- tuned for long-running experiment jobs and log watching.
# Lives in ~/dotfiles (linked by `cd ~/dotfiles && stow .`), shared on
# Linux and macOS; works locally and inside SSH / WezTerm SSHMUX sessions.
# Prefix stays the default C-b (nested tmux over SSH: C-b C-b = inner prefix).
# Reload with: prefix r. Key cheat sheet: ~/.tmux/cheatsheet.md

# ---------------------------------------------------------------------------
# Terminal & true color
# ---------------------------------------------------------------------------
# tmux-256color is missing from older macOS terminfo; fall back to screen-256color.
if 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
# zsh lives in /usr/bin on Arch, /bin (or Homebrew) on macOS: resolve via PATH.
run 'tmux set -g default-shell "$(command -v zsh || echo /bin/sh)"'
# Tell tmux which outer terminals support 24-bit color (RGB/Tc).
# Reset to defaults first so re-sourcing (prefix r) does not duplicate entries.
set -su terminal-overrides
set -su terminal-features
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",tmux-256color:Tc,screen-256color:Tc,alacritty:Tc,xterm-kitty:Tc,foot:Tc,wezterm:Tc"
set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB,screen-256color:RGB,alacritty:RGB,xterm-kitty:RGB,foot:RGB,wezterm:RGB"
# OSC 52 clipboard support for outer terminals (WezTerm reports xterm-256color,
# already covered by tmux's built-in xterm* entry) and for nested tmux over SSH.
set -as terminal-features ",wezterm:clipboard,alacritty:clipboard,xterm-kitty:clipboard,foot:clipboard,tmux*:clipboard,screen*:clipboard"

# ---------------------------------------------------------------------------
# Basics
# ---------------------------------------------------------------------------
set -g mouse on
set -g base-index 1              # windows start at 1
setw -g pane-base-index 1        # panes start at 1
set -g renumber-windows on       # close gaps when a window is closed
set -s escape-time 10            # fast Esc (vim)
set -g history-limit 100000      # long scrollback for experiment logs
set -g focus-events on
set -g status-interval 15        # clock refresh + continuum save check
# Let programs (e.g. `wezterm imgcat`) pass escape sequences to the outer terminal.
set -g allow-passthrough on

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
# prefix r: reload this file
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Splits and new windows open in the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style) and repeatable resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Copy mode (vi) + system clipboard
# ---------------------------------------------------------------------------
setw -g mode-keys vi
# Every copy goes to the system clipboard twice over:
#  1. OSC 52 to the outer terminal (set-clipboard on): works over SSH, inside
#     WezTerm SSHMUX domains and nested tmux; apps inside (nvim) may use it too.
#  2. A local tool chosen at copy time: wl-copy on Wayland, pbcopy on macOS,
#     xclip on X11, else nothing. On SSH attach, update-environment drops the
#     stale WAYLAND_DISPLAY/DISPLAY, so the remote desktop clipboard is skipped.
set -s set-clipboard on
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ---------------------------------------------------------------------------
# Long-running jobs: activity/silence, remain-on-exit, pane logging
# ---------------------------------------------------------------------------
setw -g monitor-activity off
set -g visual-activity off
set -g visual-silence off
setw -g remain-on-exit off

# prefix m: toggle "highlight this window after 30 s without output"
bind m if -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display "Silence monitor OFF for window #I"' \
    'setw monitor-silence 30 ; display "Silence monitor ON (30s) for window #I"'

# prefix R: toggle keeping panes open (with their output) after the command exits
bind R if -F '#{==:#{remain-on-exit},on}' \
    'setw remain-on-exit off ; display "remain-on-exit OFF for window #I"' \
    'setw remain-on-exit on ; display "remain-on-exit ON for window #I"'

# prefix P: toggle logging of the current pane to
#   ~/tmux-logs/<session>-<window>-<pane>-<YYYYmmdd-HHMMSS>.log
bind P if -F '#{pane_pipe}' \
    'pipe-pane ; display "Logging stopped for #S:#I.#P"' \
    'pipe-pane "mkdir -p ~/tmux-logs && cat >> ~/tmux-logs/#{q:session_name}-#I-#P-$(date +%%Y%%m%%d-%%H%%M%%S).log" ; display "Logging #S:#I.#P to ~/tmux-logs/"'

# ---------------------------------------------------------------------------
# Visual: calm neutral status bar, plain ASCII (no powerline glyphs)
# ---------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=colour250,bg=colour236"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[fg=colour236,bg=colour248,bold] #S #[default] "
set -g status-right "#[fg=colour248] #h #[fg=colour240]| #[fg=colour252]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "fg=colour246,bg=colour236"
setw -g window-status-current-style "fg=colour255,bg=colour240,bold"
# Alerts (silence / activity / bell): muted amber so a finished run stands out.
setw -g window-status-activity-style "fg=colour236,bg=colour179"
setw -g window-status-bell-style "fg=colour236,bg=colour174,bold"
set -g message-style "fg=colour255,bg=colour238"
setw -g mode-style "fg=colour255,bg=colour24"
# Pane borders: dim inactive, bright active.
setw -g pane-border-style "fg=colour238"
setw -g pane-active-border-style "fg=colour75,bold"
setw -g pane-border-lines heavy

# ---------------------------------------------------------------------------
# Plugins (TPM). status-right must be set above: continuum hooks into it.
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore layouts and working directories only; never relaunch programs.
set -g @resurrect-processes 'false'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Keep this line last.
run '~/.tmux/plugins/tpm/tpm'
